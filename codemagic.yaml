workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_ios_key
    environment:
      ios_signing:
        provisioning_profiles:
          - mon_trajet_allemand_app_store
        certificates:
          - iOS Distribution
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tonstudio.montrajet.allemand"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Generate app icon from assets/icon.png
        script: |
          # Génère toutes les tailles d'icône iOS requises à partir d'une
          # seule image source 1024x1024 (assets/icon.png). Le dossier ios/
          # n'étant pas versionné, cette étape doit tourner à chaque build,
          # juste après sa (re)génération par Capacitor ci-dessus.
          npx --yes --package @capacitor/assets capacitor-assets generate --ios
      - name: Set iOS Deployment Target to 15.0
        script: |
          # Apple impose iOS 15.0 minimum à partir d'avril 2027 (ITMS-90068).
          # Le dossier ios/ est régénéré à chaque build, donc on le corrige ici.
          sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Declare export compliance (ITSAppUsesNonExemptEncryption)
        script: |
          # Le dossier ios/ est généré à chaque build : on ajoute la clé ici.
          # L'app n'utilise que du chiffrement standard exempté (HTTPS).
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          plutil -lint "$PLIST"
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          agvtool new-version -all $(date +%s)
        working_directory: ios/App
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
